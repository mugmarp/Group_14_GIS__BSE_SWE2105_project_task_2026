name: GeoTrace CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: false
      custom_version:
        description: 'Custom version string (e.g. 1.0.1)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package GeoTrace APKs
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version_name: ${{ steps.version.outputs.VERSION_NAME }}
      version_code: ${{ steps.version.outputs.VERSION_CODE }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Ensure Debug Keystore Exists
        env:
          DEBUG_KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
        run: |
          if [ -f debug.keystore ]; then
            echo "Using existing debug.keystore"
          elif [ -f debug.keystore.base64 ]; then
            echo "Decoding debug.keystore from committed debug.keystore.base64..."
            tr -d '[:space:]' < debug.keystore.base64 | base64 -d > debug.keystore
          elif [ -n "$DEBUG_KEYSTORE_B64" ]; then
            echo "Decoding debug.keystore from GitHub Secret (DEBUG_KEYSTORE_BASE64)..."
            printf '%s' "$DEBUG_KEYSTORE_B64" | tr -d '[:space:]' | base64 -d > debug.keystore
          else
            echo "::warning::Neither debug.keystore.base64 in repo nor DEBUG_KEYSTORE_BASE64 secret found; generating random debug.keystore. Google Sign-In and in-place APK upgrades will fail!"
            echo "⚠️ **Keystore Warning:** \`debug.keystore.base64\` and \`DEBUG_KEYSTORE_BASE64\` were both missing, so CI generated a random keystore (Google Sign-In SHA-1 will NOT match Firebase and APK cannot update previous builds)." >> "$GITHUB_STEP_SUMMARY"
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          keytool -list -v -keystore debug.keystore -storepass android -alias androiddebugkey | grep -E "SHA1:|SHA256:"

      - name: Inject Google Services Configuration
        env:
          GOOGLE_SERVICES_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_BASE64" ]; then
            echo "Decoding google-services.json from GitHub Secret (GOOGLE_SERVICES_JSON_BASE64)..."
            printf '%s' "$GOOGLE_SERVICES_BASE64" | tr -d '[:space:]' | base64 -d > app/google-services.json
          elif [ -f app/google-services.json ]; then
            echo "Found existing committed app/google-services.json"
          else
            echo "::warning::Neither GOOGLE_SERVICES_JSON_BASE64 secret nor app/google-services.json found; generating geotrace-ci-mock config (Google Sign-In/Firestore will not work)."
            echo "⚠️ **Firebase Warning:** Mock \`google-services.json\` was used because \`GOOGLE_SERVICES_JSON_BASE64\` and \`app/google-services.json\` were both absent." >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' \
              '{' \
              '  "project_info": {' \
              '    "project_id": "geotrace-ci-mock",' \
              '    "project_number": "1039367946793"' \
              '  },' \
              '  "client": [' \
              '    {' \
              '      "client_info": {' \
              '        "mobilesdk_app_id": "1:1039367946793:android:6b7859d13c2d7c69c71238",' \
              '        "android_client_info": {' \
              '          "package_name": "com.geotrace"' \
              '        }' \
              '      },' \
              '      "oauth_client": [' \
              '        {' \
              '          "client_id": "1039367946793-cimockwebclientid.apps.googleusercontent.com",' \
              '          "client_type": 3' \
              '        }' \
              '      ],' \
              '      "api_key": [' \
              '        {' \
              '          "current_key": "AIzaSyCiMockPlaceholderKey000000000000"' \
              '        }' \
              '      ]' \
              '    }' \
              '  ]' \
              '}' > app/google-services.json
          fi

      - name: Resolve Version Code and Name
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF_NAME}
            VERSION=${TAG#v}
          elif [ -n "${{ github.event.inputs.custom_version }}" ]; then
            RAW_VERSION="${{ github.event.inputs.custom_version }}"
            VERSION=${RAW_VERSION#v}
          else
            VERSION="1.0.${{ github.run_number }}"
          fi

          echo "VERSION_NAME=$VERSION" >> $GITHUB_OUTPUT

          # Compute integer version code: MAJOR * 10000 + MINOR * 100 + PATCH
          # Fallback to run number if not semver
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VCODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            VCODE=${{ github.run_number }}
          fi
          echo "VERSION_CODE=$VCODE" >> $GITHUB_OUTPUT
          echo "Building GeoTrace Version: $VERSION (Code: $VCODE)"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Debug APK
        env:
          OPENCELLID_API_KEY: ${{ secrets.OPENCELLID_API_KEY }}
          ORG_GRADLE_PROJECT_versionName: ${{ steps.version.outputs.VERSION_NAME }}
          ORG_GRADLE_PROJECT_versionCode: ${{ steps.version.outputs.VERSION_CODE }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: geotrace-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release Keystore (Secrets or Fallback)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            printf '%s' "$KEYSTORE_BASE64" | tr -d '[:space:]' | base64 -d > "${{ github.workspace }}/release.keystore"
            echo "STORE_FILE=${{ github.workspace }}/release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret found; falling back to debug keystore for signed release build."
            echo "STORE_FILE=${{ github.workspace }}/debug.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Assemble Release APK
        env:
          OPENCELLID_API_KEY: ${{ secrets.OPENCELLID_API_KEY }}
          ORG_GRADLE_PROJECT_versionName: ${{ steps.version.outputs.VERSION_NAME }}
          ORG_GRADLE_PROJECT_versionCode: ${{ steps.version.outputs.VERSION_CODE }}
          ORG_GRADLE_PROJECT_signingStoreFile: ${{ env.STORE_FILE }}
          ORG_GRADLE_PROJECT_signingStorePassword: ${{ env.STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyAlias: ${{ env.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ env.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v7
        if: success()
        with:
          name: geotrace-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Official GitHub Release
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && (github.event.inputs.create_release == true || github.event.inputs.create_release == 'true'))
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v8
        with:
          name: geotrace-debug-apk
          path: ./artifacts/debug

      - name: Download Release APK
        uses: actions/download-artifact@v8
        with:
          name: geotrace-release-apk
          path: ./artifacts/release

      - name: Prepare Release Assets
        run: |
          mkdir -p ./release-assets
          cp ./artifacts/release/app-release.apk ./release-assets/geotrace-release.apk
          cp ./artifacts/debug/app-debug.apk ./release-assets/geotrace-debug.apk
          ls -la ./release-assets/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version_name }}
          name: GeoTrace v${{ needs.build.outputs.version_name }}
          files: |
            ./release-assets/geotrace-release.apk
            ./release-assets/geotrace-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: true
