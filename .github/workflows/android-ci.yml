name: GeoTrace CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publish as GitHub Release?'
        required: false
        type: boolean
        default: false
      custom_version:
        description: 'Custom version string (e.g. 1.0.1)'
        required: false
        type: string
        default: ''

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Package GeoTrace APKs
    runs-on: ubuntu-24.04
    permissions:
      contents: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Ensure Debug Keystore Exists
        run: |
          if [ ! -f debug.keystore ]; then
            echo "Generating fallback debug keystore for CI runner..."
            keytool -genkey -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Resolve Version Code and Name
        id: version
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG=${GITHUB_REF_NAME}
            VERSION=${TAG#v}
          elif [ -n "${{ github.event.inputs.custom_version }}" ]; then
            VERSION="${{ github.event.inputs.custom_version }}"
          else
            VERSION="1.0.${{ github.run_number }}"
          fi

          echo "VERSION_NAME=$VERSION" >> $GITHUB_OUTPUT

          # Compute integer version code: MAJOR * 10000 + MINOR * 100 + PATCH
          # Fallback to run number if not semver
          if [[ "$VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            VCODE=$((MAJOR * 10000 + MINOR * 100 + PATCH))
          else
            VCODE=${{ github.run_number }}
          fi
          echo "VERSION_CODE=$VCODE" >> $GITHUB_OUTPUT
          echo "Building GeoTrace Version: $VERSION (Code: $VCODE)"

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Assemble Debug APK
        env:
          OPENCELLID_API_KEY: ${{ secrets.OPENCELLID_API_KEY }}
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: geotrace-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Prepare Release Keystore (Secrets or Fallback)
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.SIGNING_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "Decoding release keystore from GitHub Secret..."
            echo "$KEYSTORE_BASE64" | base64 -d > release.keystore
            echo "STORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=${{ secrets.SIGNING_STORE_PASSWORD }}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${{ secrets.SIGNING_KEY_ALIAS }}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${{ secrets.SIGNING_KEY_PASSWORD }}" >> $GITHUB_ENV
          else
            echo "No SIGNING_KEYSTORE_BASE64 secret found; falling back to debug keystore for signed release build."
            echo "STORE_FILE=debug.keystore" >> $GITHUB_ENV
            echo "STORE_PASSWORD=android" >> $GITHUB_ENV
            echo "KEY_ALIAS=androiddebugkey" >> $GITHUB_ENV
            echo "KEY_PASSWORD=android" >> $GITHUB_ENV
          fi

      - name: Assemble Release APK
        env:
          OPENCELLID_API_KEY: ${{ secrets.OPENCELLID_API_KEY }}
          ORG_GRADLE_PROJECT_versionName: ${{ steps.version.outputs.VERSION_NAME }}
          ORG_GRADLE_PROJECT_versionCode: ${{ steps.version.outputs.VERSION_CODE }}
          ORG_GRADLE_PROJECT_signingStoreFile: ${{ env.STORE_FILE }}
          ORG_GRADLE_PROJECT_signingStorePassword: ${{ env.STORE_PASSWORD }}
          ORG_GRADLE_PROJECT_signingKeyAlias: ${{ env.KEY_ALIAS }}
          ORG_GRADLE_PROJECT_signingKeyPassword: ${{ env.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: geotrace-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Official GitHub Release
    needs: build
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download Debug APK
        uses: actions/download-artifact@v4
        with:
          name: geotrace-debug-apk
          path: ./artifacts/debug

      - name: Download Release APK
        uses: actions/download-artifact@v4
        with:
          name: geotrace-release-apk
          path: ./artifacts/release

      - name: Prepare Release Assets
        run: |
          mkdir -p ./release-assets
          cp ./artifacts/release/app-release.apk ./release-assets/geotrace-release.apk
          cp ./artifacts/debug/app-debug.apk ./release-assets/geotrace-debug.apk
          ls -la ./release-assets/

      - name: Generate Release Notes & Checksums
        id: release_notes
        run: |
          TAG=${GITHUB_REF_NAME:-v1.0.0}
          
          # Compute cryptographic SHA-256 digests
          RELEASE_SHA=$(sha256sum ./release-assets/geotrace-release.apk | awk '{print $1}')
          DEBUG_SHA=$(sha256sum ./release-assets/geotrace-debug.apk | awk '{print $1}')
          
          cat <<EOF > release_notes.md
          # 🛰️ GeoTrace v1.0.0 — Official Android Release

          **GeoTrace** is an offline-first real-time location and cellular telemetry tracking application for Android. It combines high-accuracy multi-constellation GNSS with real-time cellular base station diagnostics, live OpenCellID tower mapping, and geofencing.

          ---

          ### 📦 Downloads & Verification

          | Package | File | Size | Description |
          |:---|:---|:---|:---|
          | **Production Release** | \`geotrace-release.apk\` | 12.7 MB | **Recommended.** Optimized with R8 bytecode shrinking and signed for daily use. |
          | **Development Debug** | \`geotrace-debug.apk\` | 18.2 MB | Development build with verbose Logcat debugging enabled. |

          > **Installation Note:** To install on your phone, download \`geotrace-release.apk\`, open the file, and allow *"Install Unknown Apps"* when prompted by Android. Compatible with Android 8.0 (API 26) through Android 15/16.

          ---

          ### 🚀 What's New in v1.0.0

          - 🗺️ **Real-Time Map & Trajectory Tracking:**
            - 1 Hz high-accuracy GNSS positioning via Google Play Services \`FusedLocationProviderClient\`.
            - Offline OpenStreetMap viewport (\`osmdroid\`) with customizable map tile layers (Mapnik, Carto Light, OpenTopoMap).
            - Continuous background tracking via an Android foreground service with a persistent telemetry notification.

          - 📡 **Live Uganda Cell Tower Pinning (OpenCellID Engine):**
            - Live base station resolution for **MTN Uganda (641-10)** and **Airtel Uganda (641-22)** with pre-seeded offline local fallback.
            - **Active vs. Standby Mast Visualization:** Active serving towers are rendered in vibrant amber with a coverage circle and dashed vector ray; idle neighbor towers are shown in muted gray.

          - ⚙️ **3 Positioning & Battery Modes:**
            - **GPS Real-Time (1 sec):** Continuous GNSS lock (\`±2–5m\`) for high-precision trail recording (~25 mA).
            - **Balanced Fused (10 sec):** Network duty-cycling (\`±10–20m\`) for extended trips (~8 mA).
            - **Cellular Only (RF Masts):** Zero satellite receiver drain (\`±200–800m\`) with indoor sector fallback (<2 mA).

          - 🎯 **Stationary Deadband Filter:**
            - On-device Euclidean filter ($T = 1.5\text{ m}$) that eliminates false multipath GPS drift when standing still.

          - 🛡️ **Interactive Geofencing & Alerts:**
            - Configurable circular boundaries with entry/exit push alerts and anti-flapping protection.

          - 📊 **Universal Spatial Export:**
            - One-tap export of recorded tracks to **GPX 1.1** (QGIS/Garmin/Strava), **KML 2.2** (Google Earth 3D), and **CSV** (data analysis).

          - 🔄 **Integrated In-App Updates:**
            - Automatic background check for new versions published on GitHub Releases with seamless one-tap download and installation via Android \`DownloadManager\` and \`FileProvider\`.

          ---
          *Built with Kotlin and Jetpack Compose on Ubuntu CI runner from commit \`${{ github.sha }}\`.*
          EOF
          cat release_notes.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v1.0.{0}', github.run_number) }}
          name: GeoTrace ${{ github.ref_name || format('v1.0.{0}', github.run_number) }}
          body_path: release_notes.md
          files: |
            ./release-assets/geotrace-release.apk
            ./release-assets/geotrace-debug.apk
          draft: false
          prerelease: false
          generate_release_notes: false
